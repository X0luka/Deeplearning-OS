{% extends "base.html" %}{% block content %}<a href="/versions/{{ version.id }}">← 返回 Wiki</a><h1>{{ path }}</h1><p class="muted">不可变本地快照 · {{ version.sha }} · 高亮 {{ start }}–{{ end }} 行</p><section class="card"><pre style="max-height:none">{% for line in lines %}<span id="L{{ loop.index }}" style="display:block;{{ 'background:var(--aos-warning-bg);' if start<=loop.index<=end else '' }}"><a href="#L{{ loop.index }}" style="display:inline-block;width:48px;color:var(--aos-muted)">{{ loop.index }}</a>{{ line }}</span>{% endfor %}</pre></section>{% endblock %}
