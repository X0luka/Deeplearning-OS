{% extends "base.html" %}{% block content %}<h1>阅读历史</h1><p class="muted">每条回答保留原始版本与证据。AgentOS 会自动同步产品会话。</p><section class="card">{% for item in items %}<p><a href="/history/{{ item.source_interaction_id }}">{{ item.query }}</a><br><small class="muted">{{ item.created_at }} · {{ item.model }} · {{ item.status }}</small></p>{% else %}<p class="muted">尚无问答。打开 Wiki 后可以针对源码提问。</p>{% endfor %}</section>{% endblock %}
