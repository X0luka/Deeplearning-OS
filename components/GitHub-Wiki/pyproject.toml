[project]
name = "github-wiki"
version = "0.1.0"
description = "Local source-grounded GitHub reading product"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136,<1",
    "uvicorn>=0.48,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "markdown-it-py>=3,<5",
    "tree-sitter==0.25.2",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
]
[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.15,<1"]
[project.scripts]
github-wiki = "wiki_app.main:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["wiki_app"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["var", "raw", ".venv", ".git"]
[tool.ruff]
line-length = 110
target-version = "py312"
