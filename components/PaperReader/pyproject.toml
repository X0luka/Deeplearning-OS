[project]
name = "paper-reader"
version = "0.1.0"
description = "Evidence-grounded PDF reading, quality-validation stage"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.13,<5", "pdfplumber>=0.11,<0.12", "httpx>=0.28,<0.29", "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jinja2>=3.1.6,<4", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
pdf-reading = ["docling==2.129.0"]
dev = ["pytest>=9,<10", "ruff>=0.15,<1"]

[project.scripts]
paper-reader = "paper_reader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paper_reader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["var", ".git", ".venv"]

[tool.ruff]
line-length = 100
extend-exclude = ["var"]
