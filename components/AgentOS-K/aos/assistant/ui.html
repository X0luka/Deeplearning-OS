<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deeplearning-OS · 助手</title><link rel="stylesheet" href="/static/assistant.css"><link rel="stylesheet" href="/static/assistant-vendor/katex.min.css"><link rel="stylesheet" href="/static/primary-nav.css?v=20260929"><link rel="icon" type="image/svg+xml" href="/static/deeplearning-os.svg?v=1"></head><body>
<header><button id="sessions-toggle" aria-expanded="false" aria-controls="sessions">会话 ▾</button><strong id="title">平台助手</strong><button id="new" title="新建会话" aria-label="新建会话">＋</button></header>
<section id="sessions" hidden><input id="search" placeholder="搜索会话" aria-label="搜索会话"><nav id="sections" aria-label="会话分区"><button data-section="all" aria-pressed="true">全部</button><button data-section="paper">论文</button><button data-section="wiki">仓库</button><button data-section="general">综合</button></nav><div id="session-list"></div></section>
<div class="controls"><details id="materials"><summary id="material-summary">当前资料</summary><select id="scope" aria-label="资料范围"><option value="current">当前资料优先</option><option value="selected">仅已选资料</option><option value="all">全部资料</option></select><div id="resource-list"></div><button id="save-materials">应用</button></details><details id="model"><summary id="model-name">模型</summary><label>模型<select id="model-select"></select></label><p id="limits"></p><label>输出上限<input id="output" type="number" min="1"></label><label>思考模式<select id="thinking"><option value="default">模型默认</option><option value="off">关闭</option><option value="auto">开启</option></select></label><label>温度<input id="temperature" type="number" step="0.1" min="0" max="2"></label><label><input type="checkbox" id="tools">工具调用（跨论文、仓库与笔记）</label><label><input type="checkbox" id="web">联网搜索</label><button id="save-model">保存</button><a href="/settings/models" target="_blank" rel="noopener">模型中心 ↗</a></details></div>
<p id="notice" role="status" hidden></p><main id="messages" tabindex="0" aria-label="对话记录"></main><button id="latest" hidden>回到最新 ↓</button>
<form id="compose"><div id="selection" hidden></div><textarea id="question" rows="3" aria-label="向助手提问" placeholder="提问，或继续讨论…"></textarea><div class="actions"><button type="button" id="expand" aria-expanded="false">展开编辑</button><button type="button" id="clear">清除草稿</button><span class="space"></span><button type="button" id="stop" hidden>停止</button><button id="send" type="submit">发送 ↑</button></div></form>
<script id="config" type="application/json">__CONFIG__</script><script type="module" src="/static/assistant.js"></script></body></html>
