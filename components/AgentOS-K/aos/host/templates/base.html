<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Deeplearning-OS · 本地工作台</title>
<meta name="aos-appearance" data-host="true" data-mode="{{ appearance_mode() }}" data-token="{{ appearance_token }}">
<script src="/static/appearance.js?v=2"></script>
<link rel="stylesheet" href="/static/appearance.css?v=2">
<style>
:root{--canvas:var(--aos-bg);--surface:var(--aos-panel);--sidebar:var(--aos-sidebar);--subtle:var(--aos-subtle);--ink:var(--aos-text);--muted:var(--aos-muted);--line:var(--aos-line);--control-line:var(--aos-control);--teal:var(--aos-action);--accent-hover:var(--aos-action-hover);--on-accent:var(--aos-on-action);--accent-soft:var(--aos-selected);--focus:var(--aos-focus);--success-bg:var(--aos-success-bg);--success:var(--aos-success);--warning-bg:var(--aos-warning-bg);--warning:var(--aos-warning);--danger-bg:var(--aos-error-bg);--danger:var(--aos-error);--shadow:var(--aos-shadow)}



*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.7 var(--aos-font)}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:4px}
:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
::selection{background:var(--accent-soft);color:var(--ink)}
aside{position:fixed;inset:0 auto 0 0;width:236px;background:var(--sidebar);border-right:1px solid var(--line);padding:32px 20px;display:flex;flex-direction:column;overflow-y:auto}
aside b{font-size:20px;letter-spacing:0;color:var(--ink)}
aside small{display:block;color:var(--muted);margin:6px 0 32px;letter-spacing:.5px;font-size:10px}
aside nav{display:grid;gap:6px}
aside nav a{display:block;color:var(--muted);padding:11px 12px;border-radius:8px}
aside nav a:hover{background:var(--subtle);color:var(--ink);text-decoration:none}
aside nav a[aria-current="page"]{color:var(--teal);background:var(--accent-soft);font-weight:600}
.sidebar-footer{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding-top:32px}
.sidebar-footer p{color:var(--muted);margin:20px 0 0}






main{margin-left:236px;max-width:1370px;padding:36px 48px}
.eyebrow{font-size:11px;font-weight:600;color:var(--teal);letter-spacing:.5px;text-transform:uppercase}
h1{font-size:28px;line-height:1.3;letter-spacing:-.5px;margin:8px 0}
h2{font-size:19px;margin:0 0 12px}
.muted{color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:25px;margin:18px 0;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.grid .card{margin:0}
button,.button{background:var(--teal);color:var(--on-accent);border:1px solid transparent;border-radius:8px;padding:9px 16px;min-height:42px;cursor:pointer;font:inherit;display:inline-block;transition:background-color .15s ease}
button:hover,.button:hover{background:var(--accent-hover);text-decoration:none}
button:disabled{opacity:.5;cursor:not-allowed}
.pill{white-space:nowrap;display:inline-block;border-radius:20px;padding:3px 10px;background:var(--subtle);color:var(--muted);font-size:12px}
.pill.offline,.pill.degraded,.pill.starting,.pill.stopping,.pill.queued,.pill.running{background:var(--warning-bg);color:var(--warning)}
.pill.failed{background:var(--danger-bg);color:var(--danger)}
.pill.ok,.pill.succeeded,.pill.completed{background:var(--success-bg);color:var(--success)}
.number{font-size:38px;font-weight:600}
.table-scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:14px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--subtle)}
td{overflow-wrap:anywhere}
td:first-child{min-width:100px;max-width:420px}
tbody tr:hover{background:var(--subtle)}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.copy{white-space:pre-wrap;overflow-wrap:anywhere}
.small{font-size:12px}
input,select,textarea{background:var(--surface);color:var(--ink);border:1px solid var(--control-line);padding:9px 12px;border-radius:8px;max-width:100%;min-height:42px;font:inherit}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.notice{padding:12px;background:var(--warning-bg);color:var(--warning);border-radius:8px}
.pager{display:flex;justify-content:space-between;margin-top:18px}
@media(prefers-reduced-motion:reduce){button,.button{transition:none}}
@media(max-width:800px){
  aside{position:static;width:auto;padding:18px 20px;border-right:0;border-bottom:1px solid var(--line);display:block}
  aside b{font-size:20px}aside small{margin:2px 0 14px}
  aside nav{display:flex;gap:6px;flex-wrap:wrap}aside nav a{padding:6px 10px;font-size:13px}
  .sidebar-footer{padding-top:14px;display:flex;align-items:center;gap:12px}.sidebar-footer p{display:none}

  main{margin:0;padding:24px 18px}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}
  .card{padding:20px}h1{font-size:28px}.table-scroll table{min-width:540px}
}
</style>
<link rel="stylesheet" href="/static/primary-nav.css?v=20260929"><script type="module" src="/static/primary-nav.mjs?v=20260929"></script>
<link rel="icon" type="image/svg+xml" href="/static/deeplearning-os.svg?v=1">
</head>
<body class="aos-workspace-shell">
<nav class="aos-primary-nav" aria-label="主导航">
<a href="/" data-nav-icon="home" title="返回主菜单">主页</a>
{% if request.app.state.assistant is defined %}<a href="/assistant" data-nav-icon="chat" title="助手会话">会话</a>{% endif %}
<a href="/data" data-nav-icon="data" title="数据与知识中心">资料</a>
<a href="/settings/models" data-nav-icon="model" title="API 与模型">模型</a>
{% for p in products|default([product]) %}
<a data-product-link href="/products/{{ p.id }}/open" data-nav-icon="{{ p.navigation_icon|default('app') }}" target="_blank" rel="noopener" title="打开 {{ p.name }}">{{ p.navigation_label or p.name }}</a>
{% endfor %}
<div class="aos-nav-appearance"><label>外观<select data-appearance-select aria-label="外观模式"><option value="system">系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label><span data-theme-status role="status"></span></div>
</nav>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
