name: 改进建议
description: 用实际使用场景描述希望改善的行为。
body:
  - type: textarea
    id: journey
    attributes:
      label: 使用场景和当前困难
      description: 你希望完成什么、目前在哪一步受阻？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望达到的结果
      description: 可以怎样判断改进有效？哪些现有体验需要保留？
    validations:
      required: true
