name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_pdf:
        description: 'Also build the complete CPU PDF/OCR image'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Linux clean install and regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.10.7'
          enable-cache: false
      - name: Initialize clean developer checkout
        run: python3 scripts/init_development.py
      - name: Permit private namespaces on this disposable hosted VM
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Verify isolation before executing project tests
        run: bash scripts/run-isolated.sh python3 scripts/isolation_selfcheck.py
      - name: Rebuild locked Python environments
        run: python3 scripts/prepare_dependencies.py --uv "$(command -v uv)"
      - name: Secret patterns and dependency declarations
        run: python3 scripts/audit_preparation.py --check
      - name: Install pinned Node
        run: python3 scripts/install_node.py
      - name: Backend regressions (serial, no network or provider secrets)
        run: bash scripts/run-isolated.sh python3 scripts/test_components.py ci
      - name: Build and type-check frontends
        run: python3 scripts/prepare_frontend.py
      - name: Prepare Chromium dependencies on disposable hosted VM
        timeout-minutes: 10
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          # Bound stalled package mirrors on this disposable runner only.
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-dlos-ci-network >/dev/null
          .local/tools/node/bin/node node_modules/playwright/cli.js install-deps chromium
          python3 scripts/prepare_browser.py
      - name: Frontend regressions (serial, isolated Chromium)
        run: python3 scripts/test_frontends.py
      - name: Retain allowlisted synthetic test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-ci-reports
          retention-days: 3
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .local/preparation/ci-tests.json
            .local/preparation/ci-*-pytest.log
            .local/preparation/dependency-rebuild.json
            .local/preparation/*-sync-relocated.log
            .local/preparation/assistant-tokenizers-setup.log
            .local/preparation/static-audit.json
            .local/preparation/frontend-build.json
            .local/preparation/reader-build.log
            .local/preparation/wiki-build.log
            .local/preparation/wiki-typecheck.log
            .local/preparation/browser-install.json
            .local/preparation/browser-install.log
            .local/preparation/frontend-tests.json
            .local/preparation/*-frontend-tests.log
  windows:
    name: Windows desktop build and configuration
    needs: linux
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare verified SDK
        run: python scripts/prepare_webview2.py
      - name: Compile and test desktop configuration
        shell: pwsh
        run: |
          $sdkVersion = (Get-Content toolchain.json -Raw | ConvertFrom-Json).webview2.version
          ./scripts/build_desktop.ps1 -OutputDirectory "$PWD/dist/desktop-ci" -WebView2Directory "$PWD/.local/tools/webview2-$sdkVersion"
      - name: Retain build manifest only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build-manifest
          retention-days: 3
          path: dist/desktop-ci/build-manifest.json

  docker:
    name: Docker build and persistent-data lifecycle
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DLOS_IMAGE_TARGET: ${{ inputs.full_pdf && 'full' || 'core' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate Compose and build isolated image
        run: |
          docker compose --env-file /dev/null config --quiet
          docker compose --env-file /dev/null build
      - name: Exercise real container HTTP and recreate with saved volume
        run: python3 scripts/docker_smoke.py --project "dlos-ci-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain synthetic lifecycle report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-lifecycle
          retention-days: 3
          if-no-files-found: ignore
          include-hidden-files: true
          path: .local/preparation/docker-smoke.json
